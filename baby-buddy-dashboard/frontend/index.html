<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Baby Buddy Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      /* var(--bg) picks up the backend's inlined theme override (see server.py's
         build_theme_css) and falls back to the built-in dark default otherwise. A literal
         color here would paint dark for a flash on every load even with a light theme
         configured. */
      body { background: var(--bg, #0F1117); }
    </style>
    <script>
      /* Resolve the theme mode before first paint. Mirrors resolveMode() /
         readStoredMode() in src/utils/themeMode.js - kept as a few inline lines rather
         than an import so it runs ahead of the bundle, since every themed rule
         (the built-in light palette in styles.css, and the add-on's overrides injected
         by server.py) is gated on this attribute. Without it the page paints dark
         first and snaps to light once React mounts. */
      (function () {
        var pref = null;
        try { pref = localStorage.getItem("bbd-theme-mode"); } catch (e) { /* storage blocked */ }
        if (pref !== "light" && pref !== "dark") {
          pref = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }
        document.documentElement.setAttribute("data-mode", pref);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
